#load syntax: conjur policy load -b conjur -f authn-azure-ansible.yml

---
- !policy
  id: ansible
  body:

    - !webservice

    - !variable
      id: provider-uri 
      #https://sts.windows.net/<AZURE-TENANT-ID>/
      #You can find <AZURE-TENANT-ID> via Azure portal > Microsoft Entra ID > Overview > Tenant ID

    - !group
      id: apps
      annotations:
        description: >-
          Group of hosts permitted to authenticate using
          the authn-azure/ansible authenticator

    - !permit
      role: !group apps
      privilege:
        - read
        - authenticate
      resource: !webservice

    - !webservice
      id: status
      annotations:
        description: >-
          Status service used to verify that the Azure
          authenticator is configured correctly

    - !group
      id: operators
      annotations:
        description: >-
          Group of users permitted to check the status
          of the authenticator

    - !permit
      role: !group operators
      privilege:
        - read
      resource: !webservice status